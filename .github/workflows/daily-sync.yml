name: Daily Apify Sync

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule triggers always run in UTC; a `timezone` key
    # under `cron` is not supported and was silently ignored, so this never
    # actually ran at 10:17 America/New_York as intended.
    # 14:17 UTC = 10:17 EDT (UTC-4). During EST (UTC-5) this runs at 9:17 ET.
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: daily-apify-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch latest Apify catalog
        run: node settings/fetch_apify_actors.js

      - name: Regenerate focused repo files
        run: node settings/generate_readme_clean.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No tracked changes detected."
            exit 0
          fi

          git commit -m "chore: sync daily Apify catalog"
          git push
